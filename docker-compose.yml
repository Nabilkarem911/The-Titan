name: titan-foundation

services:
  # ============================================================================
  # PostgreSQL with pgvector
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: titan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-titan}
      POSTGRES_USER: ${POSTGRES_USER:-titan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan_dev_password_change_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titan} -d ${POSTGRES_DB:-titan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - titan-net

  # ============================================================================
  # Redis (Queue + Pub/Sub + Cache + Rate Limiting)
  # ============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: titan-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "/usr/local/etc/redis/redis.conf"
      - "--requirepass"
      - "${REDIS_PASSWORD:-titan_dev_redis_password_change_in_production}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-titan_dev_redis_password_change_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - titan-net

  # ============================================================================
  # pgAdmin (optional - dev only)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: titan-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@titan.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - titan-net

  # ============================================================================
  # Redis Insight (optional - dev only)
  # ============================================================================
  redis-insight:
    image: redis/redisinsight:2.56
    container_name: titan-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/db
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - titan-net

  # ============================================================================
  # Titan Embedding Service (local BGE-small-en-v1.5, 384-dim)
  # ============================================================================
  embed:
    build:
      context: ./services/embed
    container_name: titan-embed
    restart: unless-stopped
    ports:
      - "${EMBED_PORT:-8100}:8000"
    environment:
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    networks:
      - titan-net

  # ============================================================================
  # Titan Core API
  # ============================================================================
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    container_name: titan-core
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - HTTP_HOST=0.0.0.0
      - EMBEDDING_BASE_URL=http://embed:8000/v1
      - EMBEDDING_DIMENSIONS=384
      - EMBEDDING_API_KEY=local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - titan-ssh:/home/titan/.ssh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed:
        condition: service_healthy
    networks:
      - titan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  # ============================================================================
  # Titan Worker (queue processor)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: apps/core/Dockerfile.worker
    container_name: titan-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - SERVICE_NAME=titan-worker
      - EMBEDDING_BASE_URL=http://embed:8000/v1
      - EMBEDDING_DIMENSIONS=384
      - EMBEDDING_API_KEY=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    networks:
      - titan-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_insight_data:
    driver: local
  titan-ssh:
    driver: local

networks:
  titan-net:
    driver: bridge
    name: titan-net
