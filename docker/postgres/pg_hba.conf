# =============================================================================
# TITAN PostgreSQL HBA (host-based authentication)
# =============================================================================
# Enforce scram-sha-256 for ALL remote connections.
# Local Unix socket remains "trust" for the bootstrap role; the application
# connects via TCP with a password.
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     scram-sha-256
host    all             postgres        127.0.0.1/32            scram-sha-256
host    all             postgres        ::1/128                 scram-sha-256
host    all             titan           127.0.0.1/32            scram-sha-256
host    all             titan           ::1/128                 scram-sha-256
host    all             titan           10.0.0.0/8              scram-sha-256
host    all             titan           172.16.0.0/12           scram-sha-256
host    all             titan           192.168.0.0/16          scram-sha-256
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
