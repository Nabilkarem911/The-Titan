# =============================================================================
# TITAN Redis Configuration
# =============================================================================
# Configured for queue workloads, pub/sub, and caching.
# Local development default: bind 127.0.0.1, no password (override via env).
# Production: bind 0.0.0.0 + requirepass + protected-mode yes + ACL.
# =============================================================================

# Network
bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
loglevel notice
databases 16

# Persistence (AOF for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Memory
maxmemory 512mb
maxmemory-policy noeviction

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer limits (for pub/sub)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Security hardening
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
rename-command KEYS ""
